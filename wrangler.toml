# Cloudflare Workers configuration for Chronicle API
name = "chronicle-api"
main = "apps/server/src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

[vars]
NODE_ENV = "production"
# The base URL where your frontends are hosted (for CORS and OAuth redirects)
# APP_URL = "https://chronicle-readers.pages.dev"

# Unified Meta App Credentials
META_APP_ID = ""
TELEGRAM_CHANNEL_ID = ""
GHOST_ADMIN_URL = ""
WORDPRESS_SITE_URL = ""
SUBSTACK_PUBLICATION_URL = ""

# NOTE: Sensitive keys should NOT be placed here.
# Use `wrangler secret put <KEY>` for the following:
# - META_APP_SECRET (Used to generate HMAC-SHA256 appsecret_proof for all Meta APIs)
# - GEMINI_API_KEY
# - X_API_KEY
# - X_ACCESS_TOKEN
# - LINKEDIN_OAUTH_TOKEN
# - WORDPRESS_APP_PASSWORD
# - GHOST_ADMIN_API_KEY
# - TELEGRAM_BOT_TOKEN
# - YOUTUBE_ACCESS_TOKEN
# - GOOGLE_OAUTH_TOKEN

[site]
bucket = "./apps/readers/dist"

# Optional: Dedicated workers for different tasks
# [env.production]
# name = "chronicle-api-prod"
