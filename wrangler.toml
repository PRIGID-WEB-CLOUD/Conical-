# Cloudflare Workers configuration for Chronicle API
name = "chronicle-api"
main = "apps/server/src/standalone.ts"
compatibility_date = "2024-03-01"
compatibility_flags = [ "nodejs_compat" ]

[vars]
NODE_ENV = "production"
# The base URL where your frontends are hosted (for CORS and OAuth redirects)
# APP_URL = "https://chronicle-readers.pages.dev"

# Social Media Public Metadata IDs (Not sensitive)
INSTAGRAM_USER_ID = ""
FACEBOOK_PAGE_ID = ""
FACEBOOK_GROUP_ID = ""
TELEGRAM_CHANNEL_ID = ""
GHOST_ADMIN_URL = ""
WORDPRESS_SITE_URL = ""
SUBSTACK_PUBLICATION_URL = ""
WHATSAPP_PHONE_ID = ""

# NOTE: Sensitive keys should NOT be placed here.
# Use `wrangler secret put <KEY>` for the following:
# - GEMINI_API_KEY
# - INSTAGRAM_ACCESS_TOKEN
# - FACEBOOK_PAGE_ACCESS_TOKEN
# - X_API_KEY
# - X_ACCESS_TOKEN
# - LINKEDIN_OAUTH_TOKEN
# - WORDPRESS_APP_PASSWORD
# - GHOST_ADMIN_API_KEY
# - TELEGRAM_BOT_TOKEN
# - YOUTUBE_ACCESS_TOKEN
# - GOOGLE_OAUTH_TOKEN
# - WHATSAPP_ACCESS_TOKEN

[site]
bucket = "./apps/readers/dist"

# Optional: Dedicated workers for different tasks
# [env.production]
# name = "chronicle-api-prod"
