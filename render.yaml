# Render Blueprint Specification for Chronicle Static Sites
# Spec: https://render.com/docs/blueprint-spec
# Static sites do not support 'plan' (always free) and do not support 'origins'.

services:
  # Reader Blog Static Site (Public Magazine Frontend)
  - type: web
    name: chronicle-blog
    runtime: static
    buildCommand: npm install && npm run build:readers
    staticPublishPath: ./apps/readers/dist
    envVars:
      - key: VITE_API_URL
        value: https://chronicle-api.workers.dev/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Admin CMS Static Site (Editorial & Publishing Workspace)
  - type: web
    name: chronicle-admin
    runtime: static
    buildCommand: npm install && npm run build:admin
    staticPublishPath: ./apps/admin/dist
    envVars:
      - key: VITE_API_URL
        value: https://chronicle-api.workers.dev/api
      - key: VITE_BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
